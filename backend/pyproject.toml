[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relayn-backend"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["Django>=5.2.17,<5.3", "djangorestframework>=3.16,<4", "django-cors-headers>=4.7,<5", "psycopg[binary]>=3.2,<4", "redis>=5,<7", "celery[redis]>=5.5,<6", "django-environ>=0.12,<1"]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["config*", "infrastructure*", "core*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
